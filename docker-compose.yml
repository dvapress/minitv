name: leapdrama-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: leapdrama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leapdrama
      POSTGRES_PASSWORD: leapdrama_local
      POSTGRES_DB: leapdrama
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - leapdrama_pg:/var/lib/postgresql/data
    networks:
      - leapdrama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leapdrama -d leapdrama"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: leapdrama-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: leapdrama_local
    command: ["redis-server", "--requirepass", "leapdrama_local", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - leapdrama_redis:/data
    networks:
      - leapdrama
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  leapdrama:
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.20.0/24

volumes:
  leapdrama_pg:
  leapdrama_redis:
